# Gotcha checks: Alteryx logic that doesn't translate cleanly to Amazon Redshift.
#
# Gotchas don't change the difficulty score (that's tool_rules.yaml). They explain
# WHAT to watch for, so the report and the AI summary can be specific.
#
# severity: low    = syntax swap, same behavior
#           medium = behavior, types, or argument order differ; test carefully
#           high   = no direct equivalent, or results can silently differ

# ---------- Checks on formula text ----------
# Searched (case-insensitively) in Formula fields, custom Filter expressions,
# and Multi-Row Formula expressions.
# pattern: a regular expression. min_count: matches needed in ONE expression (default 1).

formula_checks:
  iif:
    pattern: '\bIIF\s*\('
    severity: low
    message: IIF has no Redshift equivalent.
    redshift: Rewrite as CASE WHEN ... THEN ... ELSE ... END.

  datetime_diff:
    pattern: '\bDateTimeDiff\s*\('
    severity: medium
    message: DateTimeDiff(end, start, unit) puts the dates in the opposite order to Redshift.
    redshift: DATEDIFF(unit, start, end). Check the sign of the result.

  datetime_today:
    pattern: '\bDateTime(Today|Now)\s*\('
    severity: medium
    message: Uses today's date, so results change every day.
    redshift: CURRENT_DATE or GETDATE(). Pin a fixed date when comparing old and new outputs.

  datetime_parse:
    pattern: '\bDateTimeParse\s*\('
    severity: medium
    message: Converts text to dates using Alteryx format codes (%Y, %m, %d, %b).
    redshift: TO_DATE or TO_TIMESTAMP with Redshift format codes (YYYY, MM, DD, MON).

  multiple_date_formats:
    pattern: '\bDateTimeParse\s*\('
    min_count: 2
    severity: high
    message: Several date formats are parsed in one expression, so the source data mixes formats.
    redshift: Handle each format explicitly. Alteryx can tolerate small format mismatches (such as separators) that a literal SQL translation may not; test every format.

  datetime_format:
    pattern: '\bDateTimeFormat\s*\('
    severity: low
    message: Formats dates as text using Alteryx format codes.
    redshift: TO_CHAR with Redshift format codes (e.g. 'YYYY-MM').

  datetime_add:
    pattern: '\bDateTimeAdd\s*\('
    severity: low
    message: DateTimeAdd(date, n, unit) has a different argument order.
    redshift: DATEADD(unit, n, date).

  is_empty:
    pattern: '\bIsEmpty\s*\('
    severity: medium
    message: IsEmpty is true for both NULL and empty text; SQL treats these separately.
    redshift: (x IS NULL OR x = ''), or COALESCE(NULLIF(x, ''), ...).

  is_null:
    pattern: '\bIsNull\s*\('
    severity: low
    message: Null check.
    redshift: x IS NULL.

  to_number:
    pattern: '\bToNumber\s*\('
    severity: medium
    message: Converts text to numbers. A value that isn't a valid number can behave differently.
    redshift: CAST(x AS DECIMAL(...)). In Redshift, invalid text makes the whole query fail.

  text_cleaned_before_number:
    pattern: '\bToNumber\s*\(\s*Replace\s*\('
    severity: medium
    message: Numbers arrive as formatted text (e.g. currency symbols, commas) and are cleaned before conversion.
    redshift: Clean with REPLACE before CAST, or load the column with the right type. Every format in the data must be covered.

  contains:
    pattern: '\bContains\s*\('
    severity: medium
    message: Text search inside a string; case sensitivity may differ.
    redshift: POSITION(...) > 0 or LIKE / ILIKE. Confirm whether matching should ignore case.

  title_case:
    pattern: '\bTitleCase\s*\('
    severity: low
    message: Capitalizes words to normalize inconsistent text.
    redshift: INITCAP. Results can differ for some words; spot-check the output.

  length:
    pattern: '\bLength\s*\('
    severity: low
    message: String length, here possibly used to detect a format.
    redshift: LEN or LENGTH.

  regex_in_formula:
    pattern: '\bREGEX_(Match|Replace|CountMatches)\s*\('
    severity: medium
    message: Regular expression inside a formula.
    redshift: REGEXP_INSTR / REGEXP_REPLACE / REGEXP_COUNT. Regex syntax and case settings differ.

  row_reference:
    pattern: '\[Row[+-]\d+:'
    severity: medium
    message: Refers to values in other rows (e.g. a running total).
    redshift: Window functions (LAG, LEAD, or SUM(...) OVER (PARTITION BY ... ORDER BY ... ROWS UNBOUNDED PRECEDING)). Redshift requires the frame clause when the window has ORDER BY.

  hardcoded_year:
    pattern: '\b(19|20)\d{2}\b'
    severity: medium
    message: A year is typed directly into the formula, so results go stale as time passes.
    redshift: Derive it from the data or the current date (e.g. EXTRACT(YEAR FROM CURRENT_DATE)), or make it a parameter.
# ---------- Checks on tool settings and structure ----------
# Detected in code (src/gotchas.py); the wording lives here so it's easy to edit.

structure_checks:
  csv_input:
    severity: low
    message: Reads a CSV file, which carries no data types.
    redshift: Load with COPY into a table whose column types are defined explicitly.

  union_by_name:
    severity: medium
    message: Union matches columns by name.
    redshift: UNION ALL matches columns by position. List columns in the same order in every SELECT.

  rename_before_union:
    severity: medium
    message: A column is renamed right before a Union, so the sources use different column names.
    redshift: Apply the same alias in that SELECT before the UNION ALL.

  unique_keep_first:
    severity: high
    message: Unique keeps the FIRST row per key; which row is first depends on the order data arrives.
    redshift: ROW_NUMBER() OVER (PARTITION BY key ORDER BY ...) = 1 with an explicit ORDER BY. Plain DISTINCT only removes fully identical rows.

  join_unmatched_used:
    severity: medium
    message: Unmatched Join records (L or R output) are used downstream.
    redshift: LEFT JOIN ... WHERE right_key IS NULL, as a separate query.

  avg_of_integer:
    severity: high
    message: Averages a whole-number field. Redshift's AVG on integers returns an integer, dropping the decimals.
    redshift: CAST the field to DECIMAL (or FLOAT) before AVG.

  regex_tool:
    severity: medium
    message: Uses a regular expression, and Redshift's default regex dialect differs from Alteryx's.
    redshift: REGEXP_SUBSTR. Redshift uses POSIX by default; add the 'p' parameter for Perl-style patterns (\d, \W, ...).

  regex_case_insensitive:
    severity: medium
    message: The RegEx tool is set to ignore case.
    redshift: Redshift regex is case-sensitive by default; add the 'i' parameter.

  regex_parse_group:
    severity: medium
    message: The RegEx tool extracts part of the match (a capture group).
    redshift: REGEXP_SUBSTR returns the whole match unless the 'e' parameter is added.

  python_tool:
    severity: high
    message: Runs Python code, which has no SQL equivalent.
    redshift: Rewrite the logic in SQL if possible, or run it outside Redshift. Python UDFs are no longer supported (after June 30, 2026).

  macro_dependency:
    severity: high
    message: Calls a macro, whose logic lives in a separate file.
    redshift: Analyze the macro file on its own; it must be migrated too.